[package]
name = "deepfield-settings"
version = "0.1.0"
edition = "2021"
description = "Deep Field for Windows: the Customize window"
license-file = "../../LICENSE"

# Not a member of the main crate's workspace: GPUI's dependency tree stays out of the wallpaper's
# builds, and this crate keeps its own Cargo.lock and target dir.
[workspace]

[[bin]]
name = "deepfield-settings"
path = "src/main.rs"

[dependencies]
deepfield = { path = ".." }
gpui-kit = "0.10.0"
# the same versions the GPUI and deepfield crates already pull in
image = { version = "0.25", default-features = false }
wgpu = "23"
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = false
