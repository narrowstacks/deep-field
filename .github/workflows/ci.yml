name: CI

# Builds on every push to main and every pull request, on GitHub-hosted macOS (free for
# public repos). Release signing lives in release.yml, which never runs pull request code.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build.sh numbers builds by commit count

      - name: Select the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [[ -n "$XC" ]]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build/artifacts
            .build/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (universal, ad-hoc signed)
        run: UNIVERSAL=1 ./build.sh

      - name: Check the bundle
        run: |
          plutil -lint build/DeepField.app/Contents/Info.plist
          test "$(lipo -archs build/DeepField.app/Contents/MacOS/DeepField)" = "x86_64 arm64"
          test -d build/DeepField.app/Contents/Frameworks/Sparkle.framework
          codesign --verify --deep --strict build/DeepField.app

      - name: Render a frame
        # needs a Metal device; hosted runners have a paravirtual GPU
        run: |
          build/DeepField.app/Contents/MacOS/DeepField --snapshot "$RUNNER_TEMP/frame.png" \
            --scene blackHole --size 640x360 --defaults
          test -s "$RUNNER_TEMP/frame.png"

      - name: Release notes exist for VERSION
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          test -n "$(scripts/release/notes.sh "$V")" || { echo "CHANGELOG.md has no section for $V" >&2; exit 1; }
