name: CLA

# Asks first-time contributors to sign CLA.md by commenting on their pull request, and records
# signatures on the unprotected cla-signatures branch so they never touch main or trigger CI.
# pull_request_target runs this file from main with a write token, and it never checks out pull
# request code, so the token is not exposed to it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/narrowstacks/deep-field/blob/main/CLA.md
          branch: cla-signatures
          allowlist: narrowstacks,renovate[bot],dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
