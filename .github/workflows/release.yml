name: Release

# Push a tag like v0.2.0 (matching VERSION and a CHANGELOG.md section) to build, sign,
# notarize and publish. Runs on the self-hosted Mac runner, and only on tag pushes, so
# pull request code never sees the signing secrets.
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, macOS, deep-field]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          set-safe-directory: false

      - name: Version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$(tr -d '[:space:]' < VERSION)" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))" >&2; exit 1
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          scripts/release/notes.sh "$VERSION" > "$NOTES"
          [[ -s "$NOTES" ]] || { echo "error: no CHANGELOG.md section for $VERSION" >&2; exit 1; }
          PRE=false; [[ "$VERSION" == *-* ]] && PRE=true
          {
            echo "version=$VERSION"
            echo "build=$(git rev-list --count HEAD)"
            echo "notes=$NOTES"
            echo "prerelease=$PRE"
          } >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_P12_B64 }}
          P12_PW: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046  # one argument per existing keychain path
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          IDENTITY=$(security find-identity -p codesigning -v "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [[ -n "$IDENTITY" ]] || { echo "error: no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
          UNIVERSAL: 1
        run: ./build.sh

      - name: Package DMG
        env:
          SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: scripts/release/dmg.sh

      - name: Notarize and staple
        env:
          NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_API_KEY_B64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_B64" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/release/notarize.sh

      - name: Appcast
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/release/appcast.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          [[ "${{ steps.ver.outputs.prerelease }}" == true ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/release/DeepField.dmg build/release/appcast.xml \
            --title "Deep Field ${{ steps.ver.outputs.version }}" \
            --notes-file "${{ steps.ver.outputs.notes }}" "${FLAGS[@]}"

      # The website reads releases at build time, and its Vercel builds are opt-in through a
      # [deploy] marker in the commit subject. An empty commit with that marker on its main
      # rebuilds it with this release. Made through the API, so nothing is cloned.
      - name: Deploy the website
        if: steps.ver.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          REPO: narrowstacks/deep-field-website
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          [[ -n "$GH_TOKEN" ]] || { echo "error: WEBSITE_DEPLOY_TOKEN is not set" >&2; exit 1; }
          HEAD_SHA=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
          TREE=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" -q .tree.sha)
          NEW=$(gh api "repos/$REPO/git/commits" -f message="chore: ship Deep Field $VERSION [deploy]" \
            -f tree="$TREE" -f "parents[]=$HEAD_SHA" -q .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$NEW" >/dev/null
          echo "Pushed $NEW to $REPO main"

      # The self-hosted runner persists between jobs, so remove everything secret we wrote.
      - name: Scrub signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
